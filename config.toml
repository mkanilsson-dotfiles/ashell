language = "en-US"
region = "en-GB"

[animations]
enabled = true

[modules]
left = ["Workspaces", "WindowTitle"]
center = ["Tempo"]
right = ["MediaPlayer", "Privacy",  "SystemInfo", "Notifications", "Tray", "Settings"]

[window_title]
mode = "Title"
truncate_title_after_length = 60

[media_player]
indicator_visualizer = "Background"
menu_visualizer = true
visualizer_framerate = 30
max_text_length = 45

[workspaces]
visibility_mode = "MonitorSpecific"

[appearance.bar]
# surface = "solid"

[appearance]
font_name = "JetBrains Mono"
opacity = 1.0
scale_factor = 1.1

success_color = "#98971a"
warning_color = "#d79921"
danger_color = "#cc241d"
text_color = "#ebdbb2"

workspace_colors = [ "#458588", "#458588", "#458588", "#458588" ]

[appearance.primary_color]
base = "#458588"
text = "#ebdbb2"

[appearance.background_color]
base = "#282828"
weak = "#504945"
strong = "#1d2021"
text = "#ebdbb2"
